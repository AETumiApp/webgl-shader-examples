<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradient Flow — WebGL2 Fragment Shader</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<script>
/*
 * Gradient Flow — raw WebGL2, no libraries.
 * A domain-warped, always-flowing gradient rendered on a single fullscreen
 * triangle. Uniforms: u_time, u_resolution, u_mouse.
 * https://aetumi.app/webgl  (AETumi — AI-native 3D web platform)
 */
(function () {
  "use strict";

  const canvas = document.getElementById("gl");
  const gl = canvas.getContext("webgl2", { antialias: false, alpha: false });
  if (!gl) { document.body.innerHTML = "<p style='color:#fff;font:14px sans-serif'>WebGL2 not supported.</p>"; return; }

  // A fullscreen triangle: three clip-space verts generated from gl_VertexID,
  // so we need no vertex buffer at all.
  const VERT = `#version 300 es
  precision highp float;
  const vec2 verts[3] = vec2[3](vec2(-1.0, -1.0), vec2(3.0, -1.0), vec2(-1.0, 3.0));
  void main() {
    gl_Position = vec4(verts[gl_VertexID], 0.0, 1.0);
  }`;

  const FRAG = `#version 300 es
  precision highp float;

  uniform float u_time;
  uniform vec2  u_resolution;
  uniform vec2  u_mouse;      // pixels, origin bottom-left

  out vec4 fragColor;

  // Cosine palette (Inigo Quilez). Returns a smooth color for parameter t.
  vec3 palette(float t) {
    vec3 a = vec3(0.55, 0.45, 0.65);
    vec3 b = vec3(0.45, 0.40, 0.45);
    vec3 c = vec3(1.00, 1.00, 1.00);
    vec3 d = vec3(0.00, 0.15, 0.35);
    return a + b * cos(6.28318530718 * (c * t + d));
  }

  // Cheap value-noise built from a hash, smoothed with a quintic curve.
  float hash(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }
  float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
  }

  void main() {
    // Aspect-correct, centered coordinates in [-1, 1] on the short axis.
    vec2 uv = (gl_FragCoord.xy * 2.0 - u_resolution) / u_resolution.y;
    vec2 m  = (u_mouse * 2.0 - u_resolution) / u_resolution.y;

    float t = u_time * 0.12;

    // Domain warping: feed noise into itself so the gradient "flows".
    vec2 q = vec2(noise(uv + t), noise(uv + vec2(5.2, 1.3) - t));
    vec2 r = vec2(noise(uv + 4.0 * q + vec2(1.7, 9.2) + 0.15 * t),
                  noise(uv + 4.0 * q + vec2(8.3, 2.8) - 0.12 * t));

    float flow = noise(uv + 4.0 * r);

    // Nudge the flow toward the pointer for a gentle interactive pull.
    flow += 0.20 * exp(-2.5 * length(uv - m));

    vec3 col = palette(flow + 0.15 * length(r) + t * 0.5);

    // Soft vignette so edges settle into the dark page background.
    float vig = smoothstep(1.6, 0.2, length(uv));
    col *= mix(0.65, 1.05, vig);

    fragColor = vec4(col, 1.0);
  }`;

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(sh) || "shader compile failed");
    }
    return sh;
  }

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(program) || "program link failed");
  }
  gl.useProgram(program);

  // A VAO is required to draw in WebGL2 even with no attributes.
  gl.bindVertexArray(gl.createVertexArray());

  const uTime = gl.getUniformLocation(program, "u_time");
  const uRes  = gl.getUniformLocation(program, "u_resolution");
  const uMouse = gl.getUniformLocation(program, "u_mouse");

  const mouse = { x: 0, y: 0 };
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2); // cap DPR at 2
    const w = Math.floor(canvas.clientWidth * dpr);
    const h = Math.floor(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    gl.viewport(0, 0, canvas.width, canvas.height);
    mouse.x = canvas.width * 0.5;
    mouse.y = canvas.height * 0.5;
  }
  window.addEventListener("resize", resize);
  resize();

  window.addEventListener("pointermove", function (e) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    mouse.x = e.clientX * dpr;
    mouse.y = canvas.height - e.clientY * dpr; // flip to bottom-left origin
  }, { passive: true });

  const start = performance.now();
  function frame(now) {
    // Freeze time when the viewer prefers reduced motion.
    const t = reduce.matches ? 0.0 : (now - start) / 1000;
    gl.uniform1f(uTime, t);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
