<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plasma — WebGL2 Fragment Shader</title>
<style>
  html, body { margin: 0; height: 100%; background: #04060c; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<script>
/*
 * Plasma — raw WebGL2, no libraries.
 * The classic demoscene plasma effect: layered sines of position and distance,
 * folded through a cosine palette. Uniforms: u_time, u_resolution, u_mouse.
 * https://aetumi.app/webgl  (AETumi — AI-native 3D web platform)
 */
(function () {
  "use strict";

  const canvas = document.getElementById("gl");
  const gl = canvas.getContext("webgl2", { antialias: false, alpha: false });
  if (!gl) { document.body.innerHTML = "<p style='color:#fff;font:14px sans-serif'>WebGL2 not supported.</p>"; return; }

  // Fullscreen triangle from gl_VertexID — no attribute buffers required.
  const VERT = `#version 300 es
  precision highp float;
  const vec2 verts[3] = vec2[3](vec2(-1.0, -1.0), vec2(3.0, -1.0), vec2(-1.0, 3.0));
  void main() {
    gl_Position = vec4(verts[gl_VertexID], 0.0, 1.0);
  }`;

  const FRAG = `#version 300 es
  precision highp float;

  uniform float u_time;
  uniform vec2  u_resolution;
  uniform vec2  u_mouse;     // pixels, origin bottom-left

  out vec4 fragColor;

  vec3 palette(float t) {
    vec3 a = vec3(0.5);
    vec3 b = vec3(0.5);
    vec3 c = vec3(1.0);
    vec3 d = vec3(0.00, 0.33, 0.67);
    return a + b * cos(6.28318530718 * (c * t + d));
  }

  void main() {
    // Aspect-correct coordinates in [-1, 1] on the short axis.
    vec2 uv = (gl_FragCoord.xy * 2.0 - u_resolution) / u_resolution.y;
    vec2 m  = (u_mouse * 2.0 - u_resolution) / u_resolution.y;

    float t = u_time;

    // Classic plasma: sum a handful of sine waves in x, y, and radius.
    float v = 0.0;
    v += sin((uv.x * 5.0) + t);
    v += sin((uv.y * 5.0 + t) * 0.5);
    v += sin((uv.x * 5.0 + uv.y * 5.0 + t) * 0.5);

    // A moving radial term centered near the pointer.
    vec2 c = uv - 0.6 * m;
    float d = length(c) * 4.0;
    v += sin(d + t * 1.5);

    // A second rotating center keeps it lively.
    vec2 c2 = uv + vec2(sin(t * 0.4), cos(t * 0.3)) * 0.8;
    v += sin(length(c2) * 6.0 - t * 1.2);

    v *= 0.5; // normalize the accumulated amplitude

    vec3 col = palette(v * 0.5 + t * 0.05);

    // Lift contrast slightly and settle the edges into the background.
    col = pow(clamp(col, 0.0, 1.0), vec3(0.85));
    col *= smoothstep(1.9, 0.1, length(uv)) * 0.35 + 0.7;

    fragColor = vec4(col, 1.0);
  }`;

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(sh) || "shader compile failed");
    }
    return sh;
  }

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(program) || "program link failed");
  }
  gl.useProgram(program);

  gl.bindVertexArray(gl.createVertexArray()); // required in WebGL2

  const uTime = gl.getUniformLocation(program, "u_time");
  const uRes  = gl.getUniformLocation(program, "u_resolution");
  const uMouse = gl.getUniformLocation(program, "u_mouse");

  const mouse = { x: 0, y: 0 };
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2); // cap DPR at 2
    const w = Math.floor(canvas.clientWidth * dpr);
    const h = Math.floor(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    gl.viewport(0, 0, canvas.width, canvas.height);
    mouse.x = canvas.width * 0.5;
    mouse.y = canvas.height * 0.5;
  }
  window.addEventListener("resize", resize);
  resize();

  window.addEventListener("pointermove", function (e) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    mouse.x = e.clientX * dpr;
    mouse.y = canvas.height - e.clientY * dpr; // flip to bottom-left origin
  }, { passive: true });

  const start = performance.now();
  function frame(now) {
    // Freeze on a still, pleasant frame when reduced motion is requested.
    const t = reduce.matches ? 12.0 : (now - start) / 1000;
    gl.uniform1f(uTime, t);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
